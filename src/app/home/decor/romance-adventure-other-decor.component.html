@switch (slot()) {
  @case ('stats') {
    <div
      class="trio-set"
      [class.trio-set--weak]="strLow()"
      [class.trio-set--gilded]="goldHigh()"
      [class.trio-set--arcane]="manaHigh()"
      [class.trio-set--dim]="manaLow()"
    >
      <svg class="gift" viewBox="0 0 20 20">
        <rect class="gift-body" x="3" y="8" width="14" height="10" rx="1.5" />
        <rect class="gift-lid" x="2" y="5.5" width="16" height="3.5" rx="1" />
        <rect class="gift-ribbon" x="9" y="5.5" width="2" height="12.5" />
        <path class="gift-bow" d="M10 5.2 C6.8 5.6 6.4 2.4 8.6 2.6 C9.8 2.8 10 4 10 5.2 Z" />
        <path class="gift-bow" d="M10 5.2 C13.2 5.6 13.6 2.4 11.4 2.6 C10.2 2.8 10 4 10 5.2 Z" />
      </svg>
      <svg class="flag" viewBox="0 0 20 20">
        <path class="flag-mast" d="M6 2.5 L6 18" />
        <path class="flag-cloth" d="M7 3 C11 2.4 13 3.4 16 5.2 C13 6.4 11 7.6 7 8 Z" />
      </svg>
      <svg class="emblem" viewBox="0 0 20 20">
        <circle class="emblem-glass" cx="8.6" cy="8.6" r="5.4" />
        <path class="emblem-stroke" d="M12.6 12.6 L17 17" />
      </svg>
    </div>
  }
  @case ('answer') {
    <div
      class="trio-set"
      [class.trio-set--weak]="strLow()"
      [class.trio-set--gilded]="goldHigh()"
      [class.trio-set--arcane]="manaHigh()"
      [class.trio-set--dim]="manaLow()"
    >
      <svg class="gift" viewBox="0 0 20 20">
        <rect class="gift-body" x="3" y="8" width="14" height="10" rx="1.5" />
        <rect class="gift-lid" x="2" y="5.5" width="16" height="3.5" rx="1" />
        <rect class="gift-ribbon" x="9" y="5.5" width="2" height="12.5" />
        <path class="gift-bow" d="M10 5.2 C6.8 5.6 6.4 2.4 8.6 2.6 C9.8 2.8 10 4 10 5.2 Z" />
        <path class="gift-bow" d="M10 5.2 C13.2 5.6 13.6 2.4 11.4 2.6 C10.2 2.8 10 4 10 5.2 Z" />
      </svg>
      <svg class="flag" viewBox="0 0 20 20">
        <path class="flag-mast" d="M6 2.5 L6 18" />
        <path class="flag-cloth" d="M7 3 C11 2.4 13 3.4 16 5.2 C13 6.4 11 7.6 7 8 Z" />
      </svg>
      <svg class="emblem" viewBox="0 0 20 20">
        <path
          class="emblem-fill"
          d="M4.2 3.4 C8 2.2 12 2.2 15.8 3.4 C15.8 9.2 14.2 13.9 10 16.4 C5.8 13.9 4.2 9.2 4.2 3.4 Z"
        />
        <circle class="emblem-dot" cx="7.6" cy="7.4" r="0.95" />
        <circle class="emblem-dot" cx="12.4" cy="7.4" r="0.95" />
        <path class="emblem-mouth" d="M6.8 10.4 C8 12.8 12 12.8 13.2 10.4" />
      </svg>
    </div>
  }
  @case ('foot') {
    <div
      class="trio-set"
      [class.trio-set--weak]="strLow()"
      [class.trio-set--gilded]="goldHigh()"
      [class.trio-set--arcane]="manaHigh()"
      [class.trio-set--dim]="manaLow()"
    >
      <svg class="gift gift-pair-big" viewBox="0 0 20 20">
        <rect class="gift-body" x="3" y="8" width="14" height="10" rx="1.5" />
        <rect class="gift-lid" x="2" y="5.5" width="16" height="3.5" rx="1" />
        <rect class="gift-ribbon" x="9" y="5.5" width="2" height="12.5" />
        <path class="gift-bow" d="M10 5.2 C6.8 5.6 6.4 2.4 8.6 2.6 C9.8 2.8 10 4 10 5.2 Z" />
        <path class="gift-bow" d="M10 5.2 C13.2 5.6 13.6 2.4 11.4 2.6 C10.2 2.8 10 4 10 5.2 Z" />
      </svg>
      <svg class="flag flag-pair-big" viewBox="0 0 20 20">
        <path class="flag-mast" d="M6 2.5 L6 18" />
        <path class="flag-cloth" d="M7 3 C11 2.4 13 3.4 16 5.2 C13 6.4 11 7.6 7 8 Z" />
      </svg>
      <svg class="emblem emblem-pair-big" viewBox="0 0 20 20">
        <path
          class="emblem-fill"
          d="M4.2 3.4 C8 2.2 12 2.2 15.8 3.4 C15.8 9.2 14.2 13.9 10 16.4 C5.8 13.9 4.2 9.2 4.2 3.4 Z"
        />
        <circle class="emblem-dot" cx="7.6" cy="7.4" r="0.95" />
        <circle class="emblem-dot" cx="12.4" cy="7.4" r="0.95" />
        <path class="emblem-mouth" d="M6.8 10.4 C8 12.8 12 12.8 13.2 10.4" />
      </svg>
      <svg class="emblem emblem-pair-small" viewBox="0 0 20 20">
        <path
          class="emblem-fill"
          d="M4.2 3.4 C8 2.2 12 2.2 15.8 3.4 C15.8 9.2 14.2 13.9 10 16.4 C5.8 13.9 4.2 9.2 4.2 3.4 Z"
        />
        <circle class="emblem-dot" cx="7.6" cy="7.4" r="0.95" />
        <circle class="emblem-dot" cx="12.4" cy="7.4" r="0.95" />
        <path class="emblem-mouth" d="M6.8 12.8 C8 10.6 12 10.6 13.2 12.8" />
      </svg>
    </div>
  }
  @case ('stage') {
    <svg class="vignette vg-crossroads" viewBox="0 0 140 64">
      <g transform="translate(-15.6 17.36) scale(0.72)">
        <path class="vga-soft" d="M42 28 C36 24 32 19 30 14 C35 16 40 20 43 25 Z" />
        <path class="vga-soft" d="M62 28 C68 24 72 19 74 14 C69 16 64 20 61 25 Z" />
        <ellipse class="vga-fill" cx="52" cy="28" rx="11" ry="8.5" />
        <path class="vga-detail-line vga-glare" d="M45.5 26 L50 27.5 M58.5 26 L54 27.5" />
        <path class="vga-detail" d="M51 29.8 L53 29.8 L52 31.6 Z" />
        <path class="vga-detail-line" d="M45 32.5 Q52 36.5 59 32.5" />
        <path class="vga-teeth" d="M46.5 33.3 L48 34.9 L49.5 33.7 L51 35.3 L52.5 33.9 L54 35.3 L55.5 33.7 L57 34.9 L58.5 33.3" />
        <path class="vga-fill" d="M45 54 C42 46 46 37 52 37 C58 37 62 46 59 54 C56 57 48 57 45 54 Z" />
        <path class="vga-detail-line" d="M46 48 Q52 50 58 48" />
        <path class="vga-line" d="M46 40 C42 37 39 34 38 30" />
        <circle class="vga-fill" cx="38" cy="30" r="1.6" />
        <path class="vga-line" d="M58 40 C61 42 63 45 63 48" />
        <path class="vga-line" d="M48 56.5 C47 59 46 60.5 44 62 M56 56.5 C57 59 58 60.5 60 62 M42.5 62 L47.5 62 M61.5 62 L56.5 62" />
      </g>
      <path class="vga-detail-line" d="M22 7 L22 12" />
      <circle class="vga-detail" cx="22" cy="15" r="0.9" />
      <g transform="translate(14 12.4) scale(0.8)">
        <path class="vgr-soft" d="M55.5 26 C54 8 86 8 84.5 26 C84.5 34 83 38 80.5 40 C81.5 33 81.5 28 80.5 24 L59.5 24 C58.5 28 58.5 33 59.5 40 C57 38 55.5 34 55.5 26 Z" />
        <circle class="vgr-fill" cx="70" cy="25" r="10.5" />
        <path class="vgr-soft" d="M60 22 C60 13 80 13 80 22 C76 18 74 20 70 19.5 C66 20 64 18 60 22 Z" />
        <ellipse class="vgr-detail" cx="65.5" cy="26.5" rx="1.9" ry="2.7" />
        <ellipse class="vgr-detail" cx="74.5" cy="26.5" rx="1.9" ry="2.7" />
        <circle class="vgr-spark" cx="66.2" cy="25.4" r="0.7" />
        <circle class="vgr-spark" cx="75.2" cy="25.4" r="0.7" />
        <ellipse class="vgr-blush" cx="61.5" cy="30.5" rx="2" ry="1.2" />
        <ellipse class="vgr-blush" cx="78.5" cy="30.5" rx="2" ry="1.2" />
        <path class="vgr-detail-line" d="M67.8 32.2 Q70 33.8 72.2 32.2" />
        <path class="vgr-fill" d="M64 37.5 C61 46 59 52 57 57.5 L83 57.5 C81 52 79 46 76 37.5 C72 39.5 68 39.5 64 37.5 Z" />
        <path class="vgr-detail-line" d="M63 45.5 Q70 47.5 77 45.5" />
        <path class="vgr-line" d="M63.5 40 C60.5 43 59.5 47 60 50.5 M76.5 40 C79.5 43 80.5 47 80 50.5" />
        <circle class="vgr-fill" cx="60" cy="51.5" r="1.7" />
        <circle class="vgr-fill" cx="80" cy="51.5" r="1.7" />
        <path class="vgr-line" d="M66.5 57.5 L66.5 61.5 M73.5 57.5 L73.5 61.5" />
        <ellipse class="vgr-fill" cx="65.5" cy="62" rx="2.3" ry="1.1" />
        <ellipse class="vgr-fill" cx="74.5" cy="62" rx="2.3" ry="1.1" />
      </g>
      <path class="vgr-heart" d="M70 14 C67.4 11.9 66 10.1 66 8.6 C66 7.2 67 6.3 68.2 6.3 C69 6.3 69.7 6.8 70 7.7 C70.3 6.8 71 6.3 71.8 6.3 C73 6.3 74 7.2 74 8.6 C74 10.1 72.6 11.9 70 14 Z" />
      <path class="vgr-spark-line" d="M70 1.5 L70 4.5 M66.8 2.7 L68.6 4.9 M73.2 2.7 L71.4 4.9" />
      <g transform="translate(66.2 19.1) scale(0.72)">
        <path class="vgo-fill" d="M56 30 C50 28 46.5 24 47 18.5 C50.5 18.5 55 22 56 27 Z" />
        <path class="vgo-fill" d="M84 30 C90 28 93.5 24 93 18.5 C89.5 18.5 85 22 84 27 Z" />
        <path class="vgo-fill" d="M56 26 C56 12 84 12 84 26 L84 46 C84 52 80 54 77.5 51 C75.5 48.5 73 48.5 71 51 C69 53.5 66 53.5 64 51 C62 48.5 59.5 48.5 57.8 51.2 C56.5 53 56 50 56 46 Z" />
        <ellipse class="vgo-detail" cx="64" cy="26" rx="2" ry="3.3" transform="rotate(-8 64 26)" />
        <ellipse class="vgo-detail" cx="76" cy="26" rx="2" ry="3.3" transform="rotate(8 76 26)" />
        <ellipse class="vgo-detail" cx="70" cy="34" rx="2.5" ry="3.2" />
      </g>
      <path class="vgo-line" d="M114 6.5 C114 3.5 119.5 3.5 119.5 6.2 C119.5 8.3 116.8 8.3 116.8 10.8" />
      <circle class="vgo-detail" cx="116.8" cy="13.6" r="0.9" />
    </svg>
  }
  @case ('fx') {
    @for (heart of hearts(); track $index) {
      <span
        class="heart"
        [class.heart--beating]="heart.beating"
        [class.heart--failing]="heart.failing"
        [style]="heart.style"
      >
        <svg class="heart-shape" [style]="heart.beat" viewBox="0 0 24 22">
          <path
            class="heart-body"
            d="M12 20.5 C5 15 1.5 10.5 1.5 6.8 C1.5 3.6 4 1.5 6.8 1.5 C9 1.5 11 3 12 5.2 C13 3 15 1.5 17.2 1.5 C20 1.5 22.5 3.6 22.5 6.8 C22.5 10.5 19 15 12 20.5 Z"
          />
          @if (heart.face) {
            <circle class="heart-blush" cx="6.6" cy="10.2" r="1.7" />
            <circle class="heart-blush" cx="17.4" cy="10.2" r="1.7" />
            <circle class="heart-eye" cx="8.9" cy="7.8" r="1.05" />
            <circle class="heart-eye" cx="15.1" cy="7.8" r="1.05" />
            @if (heart.dizzy) {
              <path class="heart-smile" d="M9.6 11.2 Q10.8 9.8 12 11.2 Q13.2 12.6 14.4 11.2" />
            } @else {
              <path class="heart-smile" d="M9.8 10.6 Q12 12.6 14.2 10.6" />
            }
          }
        </svg>
      </span>
    }
    @for (leaf of leaves(); track $index) {
      <span
        class="leaf"
        [class.leaf--gusty]="leaf.gusty"
        [class.leaf--jittery]="leaf.jittery"
        [style]="leaf.style"
      >
        <svg class="leaf-spin" [style]="leaf.spin" viewBox="0 0 16 16">
          <path class="leaf-body" d="M8 1 C12 4 13 9 8 15 C3 9 4 4 8 1 Z" />
          <path class="leaf-vein" d="M8 3.5 L8 12" />
        </svg>
      </span>
    }
    @for (scrap of scraps(); track $index) {
      <span
        class="scrap"
        [class.scrap--jittery]="scrap.jittery"
        [class.scrap--lucid]="scrap.lucid"
        [style]="scrap.style"
      >
        <svg class="scrap-spin" [style]="scrap.spin" viewBox="0 0 16 16">
          <path class="scrap-body" d="M3 3.6 L12.8 2.2 L13.9 8.3 L12.7 13.6 L4.1 14.1 Z" />
          <path class="scrap-lines" d="M5.2 5.9 L11 5.2 M5.5 8.1 L11.3 7.5 M5.8 10.3 L9.8 9.9" />
        </svg>
      </span>
    }
    @if (campfire()) {
      <div
        class="campfire"
        [class.campfire--vital]="healthHigh()"
        [class.campfire--faint]="healthLow()"
        [class.campfire--mana]="manaHigh()"
        [class.campfire--sturdy]="strHigh()"
        animate.enter="gm-appear"
        animate.leave="gm-vanish"
      >
        <svg viewBox="0 0 90 70">
          <circle class="fire-ember" cx="39" cy="55" r="1.6" style="animation-duration: 2.6s" />
          <circle
            class="fire-ember"
            cx="46"
            cy="57"
            r="1.9"
            style="animation-duration: 3.4s; animation-delay: -1.2s"
          />
          <circle
            class="fire-ember"
            cx="52"
            cy="55.5"
            r="1.4"
            style="animation-duration: 2.1s; animation-delay: -0.7s"
          />
          <ellipse class="fire-stone" cx="30" cy="60" rx="5" ry="3.2" />
          <ellipse class="fire-stone" cx="40" cy="62.5" rx="5.6" ry="3.4" />
          <ellipse class="fire-stone" cx="51" cy="63" rx="5.4" ry="3.3" />
          <ellipse class="fire-stone" cx="60" cy="60.5" rx="5" ry="3.1" />
        </svg>
      </div>
    }
    @if (bookPile(); as pile) {
      <div
        class="book-pile"
        [class.book-pile--leaning]="strLow()"
        animate.enter="gm-appear"
        animate.leave="gm-vanish"
      >
        <svg viewBox="0 0 90 110">
          @for (book of pile.books; track $index) {
            <g [attr.transform]="book.transform">
              <rect
                class="book-cover"
                [class.book-cover--alt]="$odd"
                [attr.x]="book.rectX"
                [attr.y]="book.rectY"
                [attr.width]="book.rectW"
                [attr.height]="book.rectH"
                rx="1.4"
              />
              <g [attr.transform]="book.markShift">
                @switch (book.mark) {
                  @case (0) {
                    <circle class="mark-stroke" r="2.1" />
                  }
                  @case (1) {
                    <path class="mark-stroke" d="M-2 -2 L2 2 M-2 2 L2 -2" />
                  }
                  @case (2) {
                    <path class="mark-stroke" d="M0 -2.4 L2.2 1.8 L-2.2 1.8 Z" />
                  }
                  @case (3) {
                    <path class="mark-stroke" d="M-3 0 Q-1.5 -2.2 0 0 Q1.5 2.2 3 0" />
                  }
                  @case (4) {
                    <path
                      class="mark-stroke"
                      d="M0 -2.6 L0.8 -0.8 L2.6 0 L0.8 0.8 L0 2.6 L-0.8 0.8 L-2.6 0 L-0.8 -0.8 Z"
                    />
                  }
                  @case (5) {
                    <circle class="mark-fill" cx="-1.4" r="0.9" />
                    <circle class="mark-fill" cx="1.4" r="0.9" />
                  }
                }
              </g>
            </g>
          }
          @if (lovebirds(); as birds) {
            <g [attr.transform]="pile.perch" animate.enter="gm-appear" animate.leave="gm-vanish">
              <g transform="translate(14 0)">
                <g class="bird" transform="scale(-1 1)">
                  <path class="bird-tail" d="M-5.5 -7 L-12 -3.5 M-5.5 -8.5 L-12 -7" />
                  <path class="bird-feet" d="M-1.5 -1.8 L-1.5 0 M1.8 -1.8 L1.8 0" />
                  <ellipse class="bird-body" cx="0" cy="-8" rx="7" ry="6.2" />
                  <circle class="bird-body" cx="5.5" cy="-15.5" r="4.2" />
                  <path class="bird-beak" d="M9.4 -16.4 L12.6 -15.4 L9.4 -14.4 Z" />
                  <circle class="bird-eye" cx="6.6" cy="-16.6" r="0.75" />
                </g>
              </g>
              <g transform="translate(-16 0)">
                <g class="bird bird--suitor" [style.transform]="birds.approach">
                  <path class="bird-tail" d="M-5.5 -7 L-12 -3.5 M-5.5 -8.5 L-12 -7" />
                  <path class="bird-feet" d="M-1.5 -1.8 L-1.5 0 M1.8 -1.8 L1.8 0" />
                  <ellipse class="bird-body" cx="0" cy="-8" rx="7" ry="6.2" />
                  <circle class="bird-body" cx="5.5" cy="-15.5" r="4.2" />
                  <path class="bird-beak" d="M9.4 -16.4 L12.6 -15.4 L9.4 -14.4 Z" />
                  <circle class="bird-eye" cx="6.6" cy="-16.6" r="0.75" />
                </g>
              </g>
            </g>
          }
        </svg>
      </div>
    }
  }
}
