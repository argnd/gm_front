<div class="login-page">
  <!--
    Sky, in paint order: the CSS nebulae sit behind the canvas the engine draws on, and the
    vignette closes the stack. #sky is the template reference the component watches to
    (re)start LoginFx.
  -->
  <div class="login-fx" aria-hidden="true">
    <span class="vein vein--romance"></span>
    <span class="vein vein--adventure"></span>
    <span class="vein vein--other"></span>
    <span class="grain"></span>
    <canvas #sky class="login-sky"></canvas>
    <span class="vignette"></span>
  </div>

  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="die" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="die-shape">
          <polygon points="50,4 89,27 89,73 50,96 11,73 11,27" />
          <polygon points="50,26 72,64 28,64" />
          <path
            d="M50 26V4M72 64l17 9M28 64l-17 9M50 26L11 27M50 26l39 1M72 64l17-37M28 64L11 27M50 96l22-32M50 96L28 64"
          />
        </svg>
        <span class="die-value">20</span>
      </div>

      <p class="login-eyebrow">Maître du Jeu</p>
      <h1 id="login-title">Rejoignez la table</h1>
      <p class="login-lead">
        Une partie de vingt tours : décrivez vos actions, le Maître du Jeu écrit la suite. Vos
        statistiques et l’ambiance influencent le récit.
      </p>

      <div class="login-action">
        <asl-google-signin-button
          type="standard"
          size="large"
          shape="pill"
          theme="filled_black"
          logo_alignment="left"
        ></asl-google-signin-button>
      </div>

    </section>
  </main>
</div>
