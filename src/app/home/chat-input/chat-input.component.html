<section
  class="chatbox gm-surface"
  [class.is-focused]="focused()"
  [class.is-loading]="loading()"
  [class.is-sealing]="sealing()"
>
  <span class="chatbox-trim" aria-hidden="true"></span>

  <header class="chatbox-head">
    <svg class="chatbox-die" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 89,27 89,73 50,96 11,73 11,27" />
      <polygon points="50,26 72,64 28,64" />
      <path
        d="M50 26V4M72 64l17 9M28 64l-17 9M50 26L11 27M50 26l39 1M72 64l17-37M28 64L11 27M50 96l22-32M50 96L28 64"
      />
    </svg>
    <label class="chatbox-ask" for="chat-input">{{ copy().placeholder }}</label>
    <ng-container *ngComponentOutlet="decor(); inputs: decorInputs('head')" />
  </header>

  <!--
    The field is uncontrolled in height: autoGrow writes an inline height on input, which
    an effect in the component clears when the text is emptied.
  -->
  <div class="chatbox-field">
    <textarea
      #field
      id="chat-input"
      class="chatbox-input"
      rows="6"
      [attr.aria-label]="copy().label"
      [ngModel]="prompt()"
      (ngModelChange)="promptChange.emit($event)"
      [disabled]="disabled()"
      (focus)="focused.set(true)"
      (blur)="focused.set(false)"
      [attr.enterkeyhint]="inputSettings.enterSends() ? 'send' : 'enter'"
      (keydown.enter)="onEnterKey($event)"
      (input)="autoGrow($event)"
    ></textarea>
    <!-- Rotating suggestion, shown only while the field is empty -->
    @if (!prompt()) {
      <span class="chatbox-hint" [class.is-fading]="hintFading()" aria-hidden="true">
        {{ currentHint() }}
      </span>
    }
    <ng-container *ngComponentOutlet="decor(); inputs: decorInputs('field-bloom-left')" />
    <ng-container *ngComponentOutlet="decor(); inputs: decorInputs('field-bloom-right')" />
  </div>

  <!-- Sits right under the field, left-aligned, above the horizon rule -->
  <app-emoji-picker [disabled]="disabled()" (pick)="insertEmoji($event)" />

  <div class="chatbox-flourish" aria-hidden="true">
    <span class="flourish-line"></span>
    <svg class="flourish-mark" viewBox="0 0 90 18">
      <circle class="flourish-dot" cx="9" cy="9" r="1.6" />
      <path class="flourish-stroke" d="M14 9 H32" />
      <path class="flourish-gem" d="M45 2 L52 9 L45 16 L38 9 Z" />
      <path class="flourish-gem-core" d="M45 5.5 L48.5 9 L45 12.5 L41.5 9 Z" />
      <path class="flourish-stroke" d="M58 9 H76" />
      <circle class="flourish-dot" cx="81" cy="9" r="1.6" />
    </svg>
    <span class="flourish-line flourish-line--end"></span>
  </div>

  <div class="chatbox-foot">
    <span class="chatbox-count" [class.is-visible]="prompt().length > 0"
      >{{ prompt().length }} caractères</span
    >
    @if (dictation.error(); as dictationError) {
      <span class="chatbox-dictation-error" role="status">{{ dictationError }}</span>
    }
    <ng-container *ngComponentOutlet="decor(); inputs: decorInputs('foot')" />
    <span class="chatbox-actions">
      <!-- No engine, no button: Firefox has none, and an inert control would only puzzle -->
      @if (dictation.available()) {
        <button
          class="chatbox-tool chatbox-mic-button"
          type="button"
          [class.is-listening]="dictation.listening()"
          [attr.aria-label]="dictation.listening() ? 'Arrêter la dictée' : 'Dicter votre action'"
          [attr.aria-pressed]="dictation.listening()"
          (click)="toggleDictation()"
          [disabled]="disabled()"
        >
          <svg class="chatbox-mic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="11.5" rx="3" />
            <path d="M5 11.5a7 7 0 0 0 14 0" />
            <path d="M12 18.5v3" />
          </svg>
          {{ dictation.listening() ? 'Écoute…' : 'Dicter' }}
        </button>
      }
      <button class="chatbox-tool" type="button" (click)="paste()" [disabled]="disabled()">
        Coller
      </button>
      <button class="chatbox-tool" type="button" (click)="emitContinue()" [disabled]="disabled()">
        {{ autoLabel }}
      </button>
      <button class="chatbox-submit" type="button" (click)="emitSubmit()" [disabled]="disabled()">
        @if (loading()) {
          <svg class="chatbox-die chatbox-die--rolling" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="50,4 89,27 89,73 50,96 11,73 11,27" />
            <polygon points="50,26 72,64 28,64" />
          </svg>
          Le dé roule…
        } @else {
          {{ copy().submit }}
        }
      </button>
    </span>
  </div>
</section>
