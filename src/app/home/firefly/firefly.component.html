<!--
  Two layers on purpose: the shell owns position and fade, the inner core owns halo and
  twinkle. The transition-duration pairs them — `speed()` for the move, a fixed 240ms for
  the opacity, so a dash can teleport (speed 0) while still fading softly.
-->
<span
  class="firefly-shell"
  [class.is-hidden]="!visible()"
  [style.transform]="'translate3d(' + x() + 'px, ' + y() + 'px, 0) scale(' + scale() + ')'"
  [style.transition-duration]="speed() + 'ms, 240ms'"
  [style.--fly-color]="color()"
  [style.--fly-glow]="glow()"
>
  <span class="firefly"></span>
</span>
