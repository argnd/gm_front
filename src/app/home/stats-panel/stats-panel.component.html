<section class="stats-panel">
  <div class="stats-header">
    <h2>Current Stats</h2>
    <button class="reset-btn" (click)="randomize.emit()" [disabled]="disabled">
      🎲 Randomize &amp; Reset
    </button>
  </div>
  <ul class="stats-grid">
    @for (stat of statsEntries; track stat.name) {
      <li class="stat-chip">
        <span class="stat-chip-name">{{ stat.name }}</span>
        <span class="stat-chip-value">{{ stat.value }}</span>
      </li>
    }
  </ul>

  @if (ambianceEntries.length) {
    <div class="ambiance-section">
      <h3 class="ambiance-title">Ambiance</h3>
      <ul class="stats-grid">
        @for (entry of ambianceEntries; track entry.label) {
          <li class="stat-chip ambiance-chip">
            <span class="stat-chip-name">{{ entry.label }}</span>
            <span class="stat-chip-value">{{ entry.value }}</span>
          </li>
        }
      </ul>
    </div>
  }
</section>
