<article class="turn-card">
  <h2>Turn {{ index + 1 }}</h2>

  <div class="turn-section">
    <span class="turn-label">Text</span>
    <p>{{ turn.text }}</p>
  </div>

  <div class="turn-section">
    <span class="turn-label">Stats</span>
    <ul class="stat-list">
      @for (stat of turn.stats; track stat.name) {
        <li><strong>{{ stat.name }}:</strong> {{ stat.value }}</li>
      }
    </ul>
  </div>

  <div class="turn-section">
    <span class="turn-label">Answer</span>
    <p>{{ turn.answer }}</p>
  </div>

  <div class="turn-section">
    <span class="turn-label">New stats</span>
    <ul class="stat-list">
      @for (stat of turn.newstats; track stat.name) {
        <li><strong>{{ stat.name }}:</strong> {{ stat.value }}</li>
      }
    </ul>
  </div>
</article>
